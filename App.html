<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFLUX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- iPad Chassis Landscape Frame Container -->
    <div class="ipad-container">
        <!-- Physical Camera Element -->
        <div class="ipad-camera"></div>

        <!-- iPad Internal Content Screen Screen -->
        <div class="ipad-screen">
              <main class="app-content">
                
                <!-- VIEW 1: CENTRAL APPLICATION GRID VIEW (HOUSES THE 6 NATIVE APPS) -->
                <div id="homeView" class="view active-view">
                    <div class="home-toolbar">
                        <h1>INFLUX</h1>
                    </div>

                    <!-- Clean Row Matrix Containing Exactly 6 Functional Apps -->
                    <div class="app-grid">
                        
                        <!-- App 1: Scripting  -->
                        <a class="app-icon-wrapper" href="socialmedia1.html"  >
                            <div class="app-icon icon-script">📝</div>
                            <div class="app-label">Scripting</div>
                        </a>

                        <!-- App 2: Image Gen -->
                        <a class="app-icon-wrapper" href="socialmedia1.html">
                            <div class="app-icon icon-imageGen">🖼️</div>
                            <div class="app-label">ImageGen</div>
                        </a>

                        <!-- App 3: Video clipping -->
                        <a class="app-icon-wrapper" href="#">
                            <div class="app-icon icon-clip">✂️</div>
                            <div class="app-label">VideoClip</div>
                        </a>

                        <!-- App 4: Touchups -->
                        <a class="app-icon-wrapper" href="socialmedia1.html">
                            <div class="app-icon icon-muse">✨</div>
                            <div class="app-label">Muse</div>
                        </a>
                        <!--app5:trends-->
                        <a class="app-icon-wrapper"  href="socialmedia3.html"  >
                            <div class="app-icon icon-trends">📈</div>
                            <div class="app-label">Trends</div>
                        </a>
                        <!--app6: c-pilot-->
                        <a class="app-icon-wrapper" href="socialmedia1.html"  >
                            <div class="app-icon icon-c-pilot">🚀</div>
                            <div class="app-label">C-Pilot</div>
                        </a>
                        


                        
            
        </div>

        <!-- System Architecture Control Framework Configured Directly Below the Screen Display -->
        <div class="control-panel-bottom">
            <!-- Row 1: App Navigation Control Intermediary Links (Go Back + Contact Us) -->
            <div class="system-nav-row">
                <button id="goBackBtn" class="nav-btn" >← Go Back</button>
                <a href="#" class="nav-btn contact-btn">Contact Us</a>
            </div>
            
            <!-- Row 2: Native Hardware Circular Base Anchor Home Button Context Element -->
            <div id="physicalHomeBtn" class="ipad-home-button" title="Click to go Home"></div>
        </div>
    </div>

    
    <!-- Interface Render Management Controller Action Script Engine Block -->
    <script src="script.js"></script>
</body>
</html>
